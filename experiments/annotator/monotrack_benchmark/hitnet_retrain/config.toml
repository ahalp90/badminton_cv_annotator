# Run from this directory. Copy to config.local.toml and set the stage and court paths.
# No detector or annotator is rerun.
[inputs]
stages = "/path/to/shuttleset/stages"
spans = "shuttleset_spans.json.gz"
courts = "/path/to/monotrack/court-results"

[execution]
feature_workers = 4
parallel_trials = 12
