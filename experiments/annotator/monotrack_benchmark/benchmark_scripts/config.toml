# Copy to config.local.toml and set the machine-specific paths there.
[paths]
inputs = "experiments/annotator/monotrack_benchmark/benchmark_results/inputs"
sources = "/path/to/shuttleset22/sources"
pose_root = "/path/to/shuttleset22/extracted-simple"
inpaint_root = "/path/to/shuttleset22/inpainted-tracks"
bundle = "experiments/annotator/tree_simplification/results/discovery_context/no_max/models/raw_baseline-seed-0"
weights = "experiments/annotator/monotrack_benchmark/hitnet_retrain/weights"
stages = "/path/to/original-shuttleset/stages"
spans = "/path/to/original-shuttleset/sset_spans.json.gz"
development_courts = "/path/to/original-shuttleset/monotrack-courts"

[execution]
monotrack_python = "/path/to/tensorflow-2.15-environment/bin/python"
annotator_python = "/path/to/annotator-environment/bin/python"
annotator_workers = 5
