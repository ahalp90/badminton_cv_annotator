[project]
name = "badminton-cv-annotator"
version = "0.1.0"
description = "Badminton video auto-annotation pipeline with optional BST-X and BRIC stroke classification."
requires-python = ">=3.12"

# Shared environment for annotation, court detection, pose extraction and
# classifier inference. Optional packages for training and development follow.
#
# Examples:
#   uv sync --extra dev                                  # Development tools and tests
#   uv sync --extra builder                              # Dataset builder
#   uv sync --extra bric --extra dev                     # BRIC training
#   uv sync --extra bric-runtime --extra bst-x-runtime   # Both classifiers
#
# RTMLib uses CPU ONNX Runtime by default. CUDA setup is described in
# docs/court_detector/usage.md.
dependencies = [
    # Core ML — both architectures are PyTorch models
    "torch>=2.5",
    "torchvision",
    # Numerics
    "numpy>=2.5.3",
    "numba>=0.68.0",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    # Hybrid annotator contact and sequence trees.
    "scikit-learn==1.9.1",  # Must match the shipped annotator model.
    "xgboost==3.4.1",  # Rally-layer trees; annotator models pickle XGBClassifier, so loading them needs it.
    "joblib>=1.6.0",
    # Video / image I/O
    "opencv-python==5.0.0.93",
    "opencv-contrib-python==5.0.0.93",  # RTMLib requires both wheels; their shared cv2 package needs matching versions.
    "rtmlib==0.0.15",  # Shared person detection and pose estimation.
    "onnxruntime==1.27.0",  # CPU inference; CUDA setup uses onnxruntime-gpu.
    "scenedetect==0.7.1",
    "Pillow",
    # Vendored TrackNetV3 runtime deps (both arches do shuttle tracking)
    "tqdm",
    "parse",
    "pycocotools",     # TrackNetV3 mask utilities.
    # Config
    "pyyaml",
    # Runtime type + shape enforcement for tensor-shape/dtype contracts.
    "jaxtyping",
    "beartype",
    "frozendict>=2.4,<3",
    "pyrefly>=0.60.0",
]

[project.optional-dependencies]

annotator-experiments = [
    "pybetterleaks==0.6.2",
    "ripgrep==15.1.0",
]

# BRIC handler runtime deps for inference (R(2+1)D-18 load + YOLO11 player
# tracking + per-stroke prediction). R(2+1)D-18 ships in torchvision
# (already a base dep) so no extra ML lib is needed beyond ultralytics.
bric-runtime = [
    "ultralytics>=8.3",   # YOLO11 player detection + built-in tracker
    "lap>=0.5.12",        # ByteTrack uses Jonker-Volgenant assignment; not a
                          # hard dep of ultralytics, but model.track() crashes
                          # without it. Declared explicitly so uv installs it
                          # and ultralytics' pip-based auto-installer never
                          # fires (uv venvs don't ship pip).
]

# BRIC training-only adds (not needed at inference).
bric-train = [
    "transformers",   # HF get_cosine_schedule_with_warmup; matches BST's pattern
    "torcheval",      # multiclass_f1_score for per-epoch val metrics
    "matplotlib",     # evaluations
    "scikit-learn",   # evaluations
]

# Dataset builder: YouTube search and download, live court-line detection and
# commentary. Last tested with yt-dlp 2026.08.19, Deno 2.9.7 and
# bgutil-ytdlp-pot-provider 1.3.1. YouTube keeps blocking older yt-dlp
# releases, so the README upgrades these after each sync.
# WhisperX is left out: it pins torch 2.8, so it needs its own environment.
builder = [
    "yt-dlp[default,deno]>=2026.8.19",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    # DeepLSD runs from its own checkout and imports these. This pytlsd commit has
    # the same line-detection code we ran, with a pybind11 that builds on Python 3.12.
    "pytlsd @ git+https://github.com/iago-suarez/pytlsd@4180ab8990ae68cc9c8797c63aa1dc47b2c714da",
    "omegaconf",
    "scikit-image",
    # CUDA court-template scoring (court_template_device = "cuda").
    "cupy-cuda13x>=14.2.0; sys_platform == 'linux'",
    # Commentary triage and cleaning.
    "google-genai",
    "bert-score",
]

# Convenience meta-extras: install both bric-runtime and bric-train.
# Use this for training (`uv sync --extra bric --extra dev`).
bric = [
    "badminton-cv-annotator[bric-runtime,bric-train]",
]

# BST-X inference also imports packages used by its training modules.
bst-x-runtime = [
    "positional-encodings",   # BST-X transformer model uses these (tempose.py)
    "torchinfo",              # Model summary utility (imported by tempose.py)
    "torcheval",              # F1 scores during evaluation
    "transformers",           # Learning-rate scheduler imported by training modules
    "tensorboard",            # SummaryWriter; module-load import in bst_x_train.py
    "scikit-learn",           # Eval / preprocessing utilities
    "matplotlib",             # Evaluation plots
]

# Dev tooling. The test suite also covers BST-X, so dev includes its runtime.
dev = [
    "badminton-cv-annotator[bst-x-runtime]",
    "pytest",
    "ipython",
    "ruff",   # configured in [tool.ruff] below; invoke via `uv run ruff check`
]

# Linux uses CUDA 13 PyTorch builds to match ONNX Runtime 1.27 GPU inference.
# macOS uses the PyPI builds, including MPS support on Apple Silicon.
# Setup and driver requirements are described in docs/training_env_setup.md.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]

[tool.ruff]
exclude = [
    "notebooks/",
    "**/deprecated/",
    "src/shared/tracknetv3/",         # Vendored TrackNetV3 inference code
    "experiments/annotator/monotrack_benchmark/monotrack/",  # Unmodified MonoTrack release
    "scripts/archive/",  # Frozen script records, preserved rather than restyled
]

[tool.ruff.lint]
# Ruff 0.16 dropped these from its defaults. The code already follows them, and the
# E402 markers guard entry points that must set up the environment before importing NumPy.
extend-select = [
    "E402", "E701", "E703", "E711", "E712", "E713", "E714", "E721", "E741", "E742", "E743",
    "F403", "F405",
]
ignore = [
    "F541",  # f-string without placeholders
    # F821 misfires on jaxtyping shape annotations like Float32[Tensor, "batch"]: ruff reads
    # the shape string as a Python forward-ref, which it isn't. Pyrefly does the undefined-name
    # check instead (see [tool.pyrefly] and the pyrefly step in the lint CI job), because it
    # resolves jaxtyping's real types. F722, its multi-axis twin, is off by default since 0.16.
    "F821",
]

[tool.ruff.lint.flake8-bugbear]
# torch.device is immutable, so it is safe as a default argument.
extend-immutable-calls = ["torch.device"]

[tool.ruff.lint.per-file-ignores]
# The smoke test reports every failing check, so each check catches everything.
"src/bric/smoke_test.py" = ["BLE001"]
# Research entry points set thread limits or import paths before loading their modules.
"experiments/court_detector/saved_views/run_views.py" = ["E402"]
"experiments/annotator/court_geometry_repair/scripts/evaluate_court_comparison.py" = ["E402"]
"experiments/annotator/court_scene_sampling/run.py" = ["E402"]
"experiments/annotator/independent_court/evaluate.py" = ["E402"]

# Undefined-name linting that ruff's F821 handed off above. Narrowed to unknown-name only
# (preset off), so it's a name check, not a type checker: no torch type-inference noise. Only
# needs jaxtyping importable to resolve the shape annotations (not torch), so the CI install is light.
[tool.pyrefly]
project-includes = ["src", "scripts", "tests"]
project-excludes = [
    "src/shared/tracknetv3/**", "**/_vendor/**", "**/deprecated/**", "**/autoseg_trials/**",
    "scripts/archive/m_miss_junk_census.py", "scripts/archive/m_sticky_gate_arm.py",
    "scripts/archive/m_sticky_gate_arm_r7.py",
]
search-path = ["src", "src/bst_x"]
preset = "off"

[tool.pyrefly.errors]
unknown-name = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: deliberately scheduled long-running tests, including full fixture or source-identity gates",
]
