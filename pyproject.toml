[project]
name = "badminton-cv-annotator"
version = "0.1.0"
description = "Badminton video auto-annotation pipeline with optional BST-X and BRIC stroke classification."
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Shared base — installed by every `uv sync`.
# These deps are shared by the annotator and classifier pipelines.
# Architecture-specific deps go in the extras groups below.
#
# Compatible coexistence notes:
#   - BRIC and BST-X inference can share one venv. Both use PyTorch,
#     TrackNetV3 and opencv.
#   - **Pose extraction runs in its own dataset-build venv.** The 2D extraction
#     path migrated to rtmlib (onnxruntime, numpy-2 clean); see
#     src/bst_x/preparing_data/requirements.txt. It no longer needs numpy<2
#     isolation, but still lives in a separate build venv managed outside this
#     pyproject. The numpy<2 OpenMMLab stack remains for reference (src/bst_x/preparing_data/requirements-legacy-3d.txt).
#   - Therefore numpy>=2 is fine for everything in this pyproject. Modern
#     TrackNetV3 (per the vendored requirements.txt header) supports it.
#
# Install patterns:
#   - BRIC training:                     uv sync --extra bric --extra dev
#   - BRIC inference only:               uv sync --extra bric-runtime
#   - Both classifier architectures:     uv sync --extra bric-runtime --extra bst-x-runtime
#   - Dev tooling only (lint / tests):   uv sync --extra dev
# ---------------------------------------------------------------------------
dependencies = [
    # Core ML — both architectures are PyTorch models
    "torch>=2.5",
    "torchvision",
    # Numerics
    "numpy",
    "pandas",
    "scipy",
    # Video / image I/O
    "opencv-python",
    "Pillow",
    # Vendored TrackNetV3 runtime deps (both arches do shuttle tracking)
    "tqdm",
    "parse",
    "pycocotools",     # used by TrackNetV3 inference_utils; if the ARM64 wheel install fails, patch and drop
    # Config
    "pyyaml",
    # Runtime type + shape enforcement for tensor-shape/dtype contracts.
    "jaxtyping",
    "beartype",
    "frozendict>=2.4,<3",
    "pyrefly>=0.60.0",
]

[project.optional-dependencies]

annotator-experiments = [
    "pybetterleaks==0.6.2",
    "ripgrep==15.1.0",
]

# BRIC handler runtime deps for inference (R(2+1)D-18 load + YOLO11 player
# tracking + per-stroke prediction). R(2+1)D-18 ships in torchvision
# (already a base dep) so no extra ML lib is needed beyond ultralytics.
bric-runtime = [
    "ultralytics>=8.3",   # YOLO11 player detection + built-in tracker
    "lap>=0.5.12",        # ByteTrack uses Jonker-Volgenant assignment; not a
                          # hard dep of ultralytics, but model.track() crashes
                          # without it. Declared explicitly so uv installs it
                          # and ultralytics' pip-based auto-installer never
                          # fires (uv venvs don't ship pip).
]

# BRIC training-only adds (not needed at inference).
bric-train = [
    "transformers",   # HF get_cosine_schedule_with_warmup; matches BST's pattern
    "torcheval",      # multiclass_f1_score for per-epoch val metrics
    "matplotlib",     # evaluations
    "scikit-learn",   # evaluations
]

# Commentary clean-pass scoring; kept out of the base install because it pulls
# in the transformers stack.
scraper = [
    "bert-score",
]

# Convenience meta-extras: install both bric-runtime and bric-train.
# Use this for training (`uv sync --extra bric --extra dev`).
bric = [
    "badminton-cv-annotator[bric-runtime,bric-train]",
]

# BST-X classifier runtime deps for in-process inference.
#
# **Pre-populated as a starting guess** from the project's existing
# requirements.txt (which is BST-X's source of truth). Comments mirror the
# usage notes from that file. The BST-X pipeline owner should prune this
# down to inference-only deps once the in-process adapter is implemented. Training-only
# tooling (tensorboard, matplotlib, etc.) can move to a future
# `bst-x-train` extras group.
#
# Pose extraction (rtmlib) deliberately omitted; it runs in its own
# dataset-build venv (src/bst_x/preparing_data/requirements.txt), outside the
# root project environment.
bst-x-runtime = [
    "positional-encodings",   # BST-X transformer model uses these (tempose.py)
    "torchinfo",              # Model summary utility (imported by tempose.py)
    "torcheval",              # multiclass_f1_score; may be used at eval time
    "transformers",           # HF cosine LR schedule (training); in case shared modules import
    "tensorboard",            # SummaryWriter; module-load import in bst_x_train.py
    "scikit-learn",           # Eval / preprocessing utilities
    "matplotlib",             # Plots; rarely needed at inference, BST-X owner can drop
]

# Dev tooling.
dev = [
    "pytest",
    "ipython",
    "ruff",   # configured in [tool.ruff] below; invoke via `uv run ruff check`
]

# uv-managed PyTorch sources: on Linux, pull torch + torchvision from
# PyTorch's CUDA wheel index so we get prebuilt CUDA wheels (works for
# both x86_64 and aarch64). On macOS, uv falls back to the default PyPI
# wheels (MPS-capable on Apple Silicon).
#
# cu128 is the default — recent enough to support current-generation
# GPUs. If your training host has a different CUDA driver version, pick
# the matching index — see docs/training_env_setup.md for the table.
# Available channels include cu121, cu124, cu126, cu128, plus nightly:
#   url = "https://download.pytorch.org/whl/nightly/cu128"
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]

[tool.ruff]
exclude = [
    "notebooks/",
    "**/deprecated/",
    "src/shared/tracknetv3/",         # Vendored TrackNetV3 inference code
    "src/courtkeynet/_vendor/",       # Vendored CourtKeyNet (see src/courtkeynet/PROVENANCE.md)
    "scripts/archive/autoseg_trials/",  # Frozen S28-S29 trial records, preserved rather than restyled
]

[tool.ruff.lint]
ignore = [
    "F541",  # f-string without placeholders
    "E401",  # multiple imports on one line
    "E731",  # lambda assignment
    "E702",  # multiple statements on one line (semicolon)
    # F722/F821 misfire on jaxtyping shape annotations like Float32[Tensor, "batch n_classes"]:
    # ruff reads the shape strings as Python forward-refs, which they aren't. Both are off
    # project-wide; pyrefly does the undefined-name check instead (see [tool.pyrefly] and the
    # pyrefly step in the lint CI job), because it resolves jaxtyping's real types.
    "F722",  # forward-annotation "syntax error" on multi-axis / scalar shapes
    "F821",  # "undefined name" on single-axis shapes
]

# Undefined-name linting that ruff's F821 handed off above. Narrowed to unknown-name only
# (preset off), so it's a name check, not a type checker: no torch type-inference noise. Only
# needs jaxtyping importable to resolve the shape annotations (not torch), so the CI install is light.
[tool.pyrefly]
project-includes = ["src", "scripts", "tests"]
project-excludes = [
    "src/shared/tracknetv3/**", "**/_vendor/**", "**/deprecated/**", "**/autoseg_trials/**",
    "scripts/archive/m_miss_junk_census.py", "scripts/archive/m_sticky_gate_arm.py",
    "scripts/archive/m_sticky_gate_arm_r7.py",
]
search-path = ["src", "src/bst_x"]
preset = "off"

[tool.pyrefly.errors]
unknown-name = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: deliberately scheduled long-running tests, including full fixture or source-identity gates",
]
