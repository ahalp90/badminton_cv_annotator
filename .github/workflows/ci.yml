name: CI

# push is scoped to main so a same-repo PR doesn't run the whole suite twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned (matches uv.lock) so a new ruff release can't fail CI on untouched code.
      - name: Install ruff
        run: pip install ruff==0.15.12
      - name: Run linting
        run: ruff check .
      # ruff's undefined-name check (F821, and F722 on multi-axis shapes) is off project-wide:
      # it misreads jaxtyping shape annotations like Float32[Tensor, "batch n_classes"] as broken
      # forward-refs. pyrefly resolves jaxtyping's real types, so it covers that gap. Narrowed to
      # unknown-name only (config in [tool.pyrefly]); needs jaxtyping importable, not torch.
      - name: Install pyrefly (undefined-name check)
        run: pip install pyrefly==1.1.1 jaxtyping==0.3.11
      - name: Check undefined names (jaxtyping-aware)
        run: pyrefly check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      # Install CPU torch first, then the pinned requirements. Torch is left
      # unpinned there, so pip skips the multi-GB CUDA wheels.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: pytest
