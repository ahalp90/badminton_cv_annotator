name: PR quality

# PR helpers. These jobs add useful context but never judge whether a PR can merge.
# The AI quick read is dormant without the PR_MESSAGE_BOT_KEY secret. See docs/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep the status name for existing branch-protection rules.
      # Commit-message style remains non-blocking.
      - name: Commit message lint is advisory
        run: echo "::notice title=Commit message review::Commit-message lint remains non-blocking."

  pr-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review PR description sections
        uses: actions/github-script@v9
        with:
          script: |
            const RECOMMENDED = ['What', 'Why', 'Testing', 'Reviewer focus'];
            const raw = context.payload.pull_request.body || '';
            const body = raw.replace(/<!--[\s\S]*?-->/g, '');

            const sections = {};
            let current = null;
            for (const line of body.split(/\r?\n/)) {
              const m = line.match(/^\s*#{1,6}\s+(.+?)\s*$/);
              if (m) { current = m[1].toLowerCase(); sections[current] = ''; }
              else if (current) { sections[current] += line + '\n'; }
            }

            const missing = RECOMMENDED.filter(
              name => !(sections[name.toLowerCase()] || '').trim()
            );
            if (missing.length) {
              core.notice(
                `Optional PR section(s) are empty or missing: ${missing.join(', ')}.`
              );
            } else {
              core.info('The PR description uses all recommended sections.');
            }

  main-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write   # edit the PR body to insert the file list
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need base + head to diff the PR range
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Deterministic, stdlib-only. Inserts/refreshes a short "Main files changed"
      # block (top files by churn). Idempotent: a no-op edit is skipped, so it
      # doesn't retrigger this `edited`-listening workflow. Never blocks.
      - name: Add "Main files changed" to the PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pr_main_files.py

  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # post/update the quick-read comment
    env:
      GEMINI_API_KEY: ${{ secrets.PR_MESSAGE_BOT_KEY }}   # dormant unless set
      GEMINI_MODEL: ${{ vars.PR_MESSAGE_BOT_MODEL }}       # optional model override
    steps:
      - name: Dormant notice (no key configured)
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "PR_MESSAGE_BOT_KEY secret not set -- AI quick read is dormant (this is fine). See docs/ci.md to enable it for free."

      - uses: actions/checkout@v7
        if: ${{ env.GEMINI_API_KEY != '' }}
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: ${{ env.GEMINI_API_KEY != '' }}
        with:
          python-version: "3.11"
      # Script never exits non-zero: rate-limit/outage/bad-model -> ::warning::, not a failure.
      - name: AI PR quick read (non-blocking)
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pr_advisory.py
