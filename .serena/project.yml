project_name: "badminton_cv_annotator"
languages:
- python_pyrefly
encoding: "utf-8"
activation_command:
activation_command_timeout: 180.0
line_ending:
language_backend: LSP
ignore_all_files_in_gitignore: true
ls_specific_settings:
  python_pyrefly:
    pyrefly_version: "1.2.0"
    indexing_mode: "lazy-blocking"
ls_workspace_folders:
- "src"
ls_additional_workspace_folders:
- "tests"
- "scratch/serve_start_trajectory_exploration"
ignored_paths:
- "local_scratch/**"
- "scratch/swarm_review/**"
- "scripts/archive/**"
- "experiments/**"
- "data/**"
- "runtime/checkpoints/**"
- "runtime/deployed/**"
- "training/data/**"
- "training/*/cache/**"
- "training/*/experiments/**"
read_only: false
excluded_tools:
- replace_in_files
- replace_symbol_body
- insert_after_symbol
- insert_before_symbol
- activate_project
included_optional_tools: []
fixed_tools: []
default_modes:
- no-onboarding
- no-memories
added_modes: []
initial_prompt: ""
symbol_info_budget:
read_only_memory_patterns: []
ignored_memory_patterns: []
